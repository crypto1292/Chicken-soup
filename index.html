<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#70452f">

<title>Chicken Soup Library</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#f5eee5;
color:#38291f;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
padding:45px 20px 25px;
background:linear-gradient(145deg,#9a633f,#67412d);
color:white;
border-radius:0 0 30px 30px;
}

.logo{
font-size:45px;
}

h1{
font-family:Georgia,serif;
margin:5px 0;
font-size:29px;
}

header p{
margin:0;
opacity:.8;
}

.search{
margin-top:20px;
width:100%;
padding:14px;
border:0;
border-radius:14px;
font-size:16px;
}

main{
padding:20px 16px 100px;
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

h2{
font-family:Georgia,serif;
}

.add{
background:#70452f;
color:white;
border:0;
padding:12px 15px;
border-radius:13px;
font-weight:bold;
}

#file{
display:none;
}

.books{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-top:20px;
}

.book{
background:#fffaf4;
border-radius:18px;
overflow:hidden;
box-shadow:0 8px 25px rgba(70,45,25,.12);
border:1px solid #eadccd;
}

.cover{
height:180px;
background:linear-gradient(145deg,#c58b58,#75462f);
color:white;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
font-family:Georgia,serif;
font-size:20px;
font-weight:bold;
}

.info{
padding:13px;
}

.title{
font-weight:bold;
line-height:1.3;
}

.type{
font-size:12px;
color:#806f60;
margin-top:5px;
}

.read{
margin-top:10px;
width:100%;
padding:10px;
border:0;
border-radius:10px;
background:#eadaca;
color:#69432f;
font-weight:bold;
}

.empty{
text-align:center;
padding:55px 20px;
}

.empty div{
font-size:60px;
}

.empty h3{
font-family:Georgia,serif;
font-size:22px;
}

.empty p{
color:#806f60;
line-height:1.5;
}

.reader{
display:none;
position:fixed;
inset:0;
background:#fffaf4;
z-index:20;
overflow:auto;
}

.readerTop{
position:sticky;
top:0;
background:rgba(255,250,244,.96);
padding:15px;
border-bottom:1px solid #eadccd;
display:flex;
align-items:center;
gap:10px;
}

.back{
border:0;
background:#eadaca;
padding:9px 13px;
border-radius:10px;
}

.readerTitle{
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.readerText{
max-width:700px;
margin:auto;
padding:30px 22px 100px;
font-family:Georgia,serif;
font-size:19px;
line-height:1.8;
white-space:pre-wrap;
}

.controls{
padding:10px 15px;
display:flex;
gap:8px;
border-bottom:1px solid #eadccd;
}

.controls button{
border:1px solid #eadccd;
background:#fffaf4;
padding:8px 12px;
border-radius:9px;
}

@media(min-width:600px){

.books{
grid-template-columns:repeat(3,1fr);
}

}

</style>

</head>

<body>

<header>

<div class="logo">🍲</div>

<h1>Chicken Soup Library</h1>

<p>Stories that feed the soul</p>

<input
class="search"
id="search"
placeholder="Search your library..."
>

</header>


<main>

<div class="top">

<h2>My Library</h2>

<button
class="add"
onclick="document.getElementById('file').click()">

＋ Add Book

</button>

</div>


<input
id="file"
type="file"
accept=".txt,.html,.htm"
>


<div
id="empty"
class="empty">

<div>📚</div>

<h3>Your library is empty</h3>

<p>
Tap "Add Book" to import a TXT or HTML book
from your iPhone Files app.
</p>

<button
class="add"
onclick="document.getElementById('file').click()">

Add Your First Book

</button>

</div>


<div
id="books"
class="books">
</div>

</main>


<div
id="reader"
class="reader">

<div class="readerTop">

<button
class="back"
onclick="closeReader()">

← Library

</button>

<div
id="readerTitle"
class="readerTitle">
</div>

</div>


<div class="controls">

<button onclick="changeFont(-1)">
A−
</button>

<button onclick="changeFont(1)">
A+
</button>

</div>


<div
id="readerText"
class="readerText">
</div>

</div>


<script>

let books=[];

let currentBook=null;

let fontSize=19;


function save(){

try{

localStorage.setItem(
"chickenSoupBooks",
JSON.stringify(books)
);

}catch(e){

console.log(e);

}

}


function load(){

try{

books=
JSON.parse(
localStorage.getItem(
"chickenSoupBooks"
)||"[]"
);

}catch(e){

books=[];

}

render();

}


function render(){

let search=
document
.getElementById("search")
.value
.toLowerCase();

let list=
books.filter(book=>
book.title
.toLowerCase()
.includes(search)
);


document
.getElementById("empty")
.style.display=
books.length
?"none"
:"block";


document
.getElementById("books")
.innerHTML=
list.map((book,index)=>`

<div class="book">

<div class="cover">

🍲

<br>

${escapeHTML(book.title)}

</div>

<div class="info">

<div class="title">
${escapeHTML(book.title)}
</div>

<div class="type">
${book.type}
</div>

<button
class="read"
onclick="openBook(${index})">

Read Book

</button>

</div>

</div>

`).join("");

}


function escapeHTML(text){

return text
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


document
.getElementById("file")
.addEventListener(
"change",
function(){

let file=this.files[0];

if(!file)return;


let reader=
new FileReader();


reader.onload=function(e){

let content=e.target.result;


let title=
file.name
.replace(
/\.(txt|html?|TXT|HTML?)$/,
""
);


if(
file.name
.toLowerCase()
.endsWith(".html")
||
file.name
.toLowerCase()
.endsWith(".htm")
){

let temp=
document.createElement("div");

temp.innerHTML=content;

content=
temp.innerText||
temp.textContent;

}


books.unshift({

title:title,

content:content,

type:file.name
.split(".")
.pop()
.toUpperCase()

});


save();

render();

};


reader.readAsText(file);

this.value="";

});


function openBook(index){

currentBook=
books[index];


document
.getElementById("readerTitle")
.textContent=
currentBook.title;


document
.getElementById("readerText")
.textContent=
currentBook.content;


document
.getElementById("readerText")
.style.fontSize=
fontSize+"px";


document
.getElementById("reader")
.style.display=
"block";

}


function closeReader(){

document
.getElementById("reader")
.style.display=
"none";

}


function changeFont(amount){

fontSize+=amount;

if(fontSize<14)
fontSize=14;

if(fontSize>30)
fontSize=30;


document
.getElementById("readerText")
.style.fontSize=
fontSize+"px";

}


document
.getElementById("search")
.addEventListener(
"input",
render
);


load();

</script>

</body>
</html>
