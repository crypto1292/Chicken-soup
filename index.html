<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b2418">

<title>Chicken Soup Library</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html{
background:#21150f;
}

body{
margin:0;
background:
radial-gradient(circle at top,#5b3825 0,#2b1b13 45%,#17100c 100%);
color:#f7ead7;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
min-height:100vh;
}

button,
input{
font:inherit;
}


/* =========================
   LIBRARY HEADER
========================= */

header{
position:relative;
padding:
calc(28px + env(safe-area-inset-top))
20px
30px;

background:
linear-gradient(
180deg,
rgba(91,56,37,.98),
rgba(52,31,21,.98)
);

border-bottom:
4px solid #9b6a3e;

box-shadow:
0 8px 25px rgba(0,0,0,.45);
}

.headerInner{
max-width:850px;
margin:auto;
text-align:center;
}

.lamp{
font-size:36px;
margin-bottom:4px;
}

h1{
margin:0;
font-family:Georgia,serif;
font-size:30px;
letter-spacing:.3px;
}

.subtitle{
margin-top:7px;
color:#d9bd94;
font-size:13px;
}


/* =========================
   SEARCH
========================= */

.search{
width:100%;
max-width:600px;

margin:20px auto 0;

display:block;

padding:14px 17px;

border:1px solid #8a603c;
border-radius:14px;

background:#24160f;
color:white;

outline:none;

font-size:16px;
}

.search::placeholder{
color:#bda88e;
}


/* =========================
   MAIN
========================= */

main{
max-width:900px;
margin:auto;

padding:
22px
16px
100px;
}

.sectionTitle{
font-family:Georgia,serif;
font-size:24px;
margin:0 0 14px;
}


/* =========================
   ADD BUTTON
========================= */

.addButton{
display:block;

width:100%;

padding:17px;

border:1px solid #c29661;

border-radius:15px;

background:
linear-gradient(
180deg,
#a97745,
#79502f
);

color:white;

font-size:17px;

font-weight:bold;

box-shadow:
0 5px 12px rgba(0,0,0,.3);

margin-bottom:20px;
}

.addButton:active{
transform:scale(.98);
}


/* =========================
   FILE INPUT
========================= */

#fileInput{
display:none;
}


/* =========================
   SHELF
========================= */

.shelf{
position:relative;

padding:
15px
10px
28px;

margin-bottom:30px;

background:
linear-gradient(
180deg,
transparent 0 80%,
#3a2115 80% 88%,
#774a2c 88% 100%
);

border-radius:10px;
}


/* =========================
   BOOK GRID
========================= */

.grid{
display:grid;

grid-template-columns:
repeat(2,1fr);

gap:16px;
}


/* =========================
   BOOK
========================= */

.book{
position:relative;

min-width:0;

background:
linear-gradient(
145deg,
#6c4228,
#321e14
);

border:
1px solid #9a6b43;

border-radius:6px;

overflow:hidden;

box-shadow:
5px 7px 12px rgba(0,0,0,.45);
}

.bookCover{
height:185px;

padding:16px;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

text-align:center;

font-family:Georgia,serif;

background:
linear-gradient(
135deg,
#75452b,
#3d2317
);

border-bottom:
1px solid #a77549;
}

.book.audio .bookCover{
background:
linear-gradient(
135deg,
#4b496c,
#211f36
);
}

.coverIcon{
font-size:42px;

margin-bottom:12px;
}

.bookTitle{
font-size:17px;

font-weight:bold;

line-height:1.25;
}

.bookType{
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;

font-size:10px;

margin-top:9px;

color:#d8bd99;

letter-spacing:.7px;
}

.bookButtons{
padding:10px;
}

.openButton{
width:100%;

padding:10px;

border:0;

border-radius:9px;

background:#d4ad7b;

color:#301d12;

font-weight:bold;
}

.deleteButton{
position:absolute;

top:7px;
right:7px;

width:30px;
height:30px;

border:0;

border-radius:50%;

background:
rgba(20,10,5,.8);

color:white;

font-size:18px;

z-index:5;
}


/* =========================
   EMPTY
========================= */

.empty{
padding:50px 20px;

text-align:center;

background:
rgba(30,18,12,.7);

border:
1px dashed #7d5739;

border-radius:18px;
}

.emptyIcon{
font-size:55px;
}

.empty h2{
font-family:Georgia,serif;
}

.empty p{
color:#c9b49a;
line-height:1.5;
}


/* =========================
   READER
========================= */

.reader{
display:none;

position:fixed;

inset:0;

z-index:10000;

background:#f5ead9;

color:#302016;

overflow:auto;
}

.readerHeader{
position:sticky;

top:0;

z-index:10;

background:#4b2d1d;

color:white;

padding:
calc(12px + env(safe-area-inset-top))
12px
12px;

display:flex;

align-items:center;

gap:12px;
}

.back{
border:0;

border-radius:9px;

padding:9px 13px;

background:#d4ad7b;

color:#301d12;

font-weight:bold;
}

.readerTitle{
font-family:Georgia,serif;

font-weight:bold;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;
}

.readerContent{
max-width:720px;

margin:auto;

padding:
30px
22px
100px;

font-family:Georgia,serif;

font-size:19px;

line-height:1.8;

white-space:pre-wrap;
}


/* =========================
   AUDIO PLAYER
========================= */

.audioScreen{
text-align:center;

padding-top:25px;
}

.album{
width:210px;
height:210px;

margin:
0 auto
25px;

display:flex;

align-items:center;

justify-content:center;

font-size:80px;

border-radius:20px;

background:
linear-gradient(
145deg,
#5d587d,
#29253e
);

box-shadow:
0 15px 35px rgba(0,0,0,.2);
}

.audioScreen h2{
font-family:Georgia,serif;

font-size:25px;

line-height:1.3;
}

.audioScreen p{
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;

font-size:13px;

color:#725b48;

word-break:break-word;
}

.audioScreen audio{
width:100%;

margin:
20px
0;
}

.controls{
display:flex;

justify-content:center;

gap:10px;

margin-top:10px;
}

.controls button{
border:0;

border-radius:12px;

padding:12px 15px;

background:#e3c49c;

color:#392316;

font-weight:bold;
}

.speed{
display:flex;

justify-content:center;

gap:6px;

flex-wrap:wrap;

margin-top:18px;
}

.speed button{
border:1px solid #c7aa84;

background:#f8eee1;

border-radius:9px;

padding:7px 10px;
}


/* =========================
   DESKTOP
========================= */

@media(min-width:650px){

.grid{
grid-template-columns:
repeat(4,1fr);
}

}

</style>
</head>


<body>


<header>

<div class="headerInner">

<div class="lamp">
🕯️
</div>

<h1>
Chicken Soup Library
</h1>

<div class="subtitle">
A quiet place for stories, wisdom & inspiration
</div>


<input
id="search"
class="search"
type="search"
placeholder="🔎 Search your library">

</div>

</header>


<main>


<button
type="button"
id="addButton"
class="addButton">

📚 ＋ Add Book or Audiobook

</button>


<input
id="fileInput"
type="file"
accept=".txt,.html,.htm,.pdf,.mp3,.m4a,.m4b,.wav">


<section>

<h2 class="sectionTitle">
📖 My Books
</h2>

<div
id="bookShelf"
class="shelf">

<div
id="bookGrid"
class="grid">
</div>

</div>

</section>


<section>

<h2 class="sectionTitle">
🎧 Audiobooks
</h2>

<div
id="audioShelf"
class="shelf">

<div
id="audioGrid"
class="grid">
</div>

</div>

</section>


<div
id="empty"
class="empty">

<div class="emptyIcon">
🏛️
</div>

<h2>
Welcome to your library
</h2>

<p>
Add your books and audiobooks from
the iPhone Files app and build your
personal collection.
</p>

</div>


</main>


<!-- =========================
     READER
========================= -->

<div
id="reader"
class="reader">


<div class="readerHeader">

<button
type="button"
id="backButton"
class="back">

← Library

</button>


<div
id="readerTitle"
class="readerTitle">
</div>

</div>


<div
id="readerContent"
class="readerContent">
</div>


</div>


<script>

/* ==========================================
   WORKING FILE PICKER
========================================== */

var addButton =
document.getElementById("addButton");

var fileInput =
document.getElementById("fileInput");


addButton.onclick = function(){

fileInput.click();

};


/* ==========================================
   LIBRARY
========================================== */

var books = [];

var search =
document.getElementById("search");

var bookGrid =
document.getElementById("bookGrid");

var audioGrid =
document.getElementById("audioGrid");

var empty =
document.getElementById("empty");

var bookShelf =
document.getElementById("bookShelf");

var audioShelf =
document.getElementById("audioShelf");


/* ==========================================
   SELECT FILE
========================================== */

fileInput.onchange = function(){

if(!fileInput.files.length){
return;
}

var file =
fileInput.files[0];

importFile(file);

};


/* ==========================================
   IMPORT
========================================== */

function importFile(file){

var name =
file.name;

var lower =
name.toLowerCase();

var title =
name.replace(
/\.[^/.]+$/,
""
);


/* AUDIO */

if(
lower.endsWith(".mp3") ||
lower.endsWith(".m4a") ||
lower.endsWith(".m4b") ||
lower.endsWith(".wav")
){

var audioBook = {

id:Date.now(),

title:title,

filename:name,

type:"audio",

file:file,

position:0

};

books.unshift(
audioBook
);

render();

openAudio(
audioBook
);

return;

}


/* TEXT */

if(
lower.endsWith(".txt") ||
lower.endsWith(".html") ||
lower.endsWith(".htm")
){

var reader =
new FileReader();


reader.onload =
function(){

var textBook = {

id:Date.now(),

title:title,

filename:name,

type:"book",

content:reader.result

};

books.unshift(
textBook
);

saveTextBooks();

render();

openBook(
textBook
);

};


reader.readAsText(file);

return;

}


/* PDF */

if(
lower.endsWith(".pdf")
){

var pdfReader =
new FileReader();


pdfReader.onload =
function(){

var pdfBook = {

id:Date.now(),

title:title,

filename:name,

type:"pdf",

data:pdfReader.result

};

books.unshift(
pdfBook
);

saveTextBooks();

render();

openPDF(
pdfBook
);

};


pdfReader.readAsArrayBuffer(file);

return;

}


alert(
"That file type isn't supported yet."
);

}


/* ==========================================
   RENDER
========================================== */

function render(){

var term =
search.value
.toLowerCase()
.trim();


bookGrid.innerHTML = "";

audioGrid.innerHTML = "";


var visible =
books.filter(
function(item){

return item.title
.toLowerCase()
.includes(term);

});


var hasBooks = false;

var hasAudio = false;


visible.forEach(
function(item){

var card =
createCard(item);

if(
item.type === "audio"
){

audioGrid.appendChild(
card
);

hasAudio = true;

}else{

bookGrid.appendChild(
card
);

hasBooks = true;

}

});


bookShelf.style.display =
hasBooks
? "block"
: "none";


audioShelf.style.display =
hasAudio
? "block"
: "none";


empty.style.display =
visible.length === 0
? "block"
: "none";

}


/* ==========================================
   CREATE CARD
========================================== */

function createCard(item){

var card =
document.createElement("div");

card.className =
"book" +
(
item.type === "audio"
? " audio"
: ""
);


var cover =
document.createElement("div");

cover.className =
"bookCover";


var icon =
document.createElement("div");

icon.className =
"coverIcon";

icon.textContent =
item.type === "audio"
? "🎧"
: item.type === "pdf"
? "📕"
: "📖";


var title =
document.createElement("div");

title.className =
"bookTitle";

title.textContent =
item.title;


var type =
document.createElement("div");

type.className =
"bookType";

type.textContent =
item.type === "audio"
? "AUDIOBOOK"
: item.type === "pdf"
? "PDF BOOK"
: "BOOK";


cover.appendChild(
icon
);

cover.appendChild(
title
);

cover.appendChild(
type
);


/* DELETE */

var del =
document.createElement("button");

del.type =
"button";

del.className =
"deleteButton";

del.textContent =
"×";


del.onclick =
function(event){

event.stopPropagation();

if(
confirm(
"Remove this item from your library?"
)
){

var index =
books.indexOf(item);

if(index >= 0){

books.splice(
index,
1
);

}

saveTextBooks();

render();

}

};


/* BUTTON AREA */

var buttons =
document.createElement("div");

buttons.className =
"bookButtons";


var open =
document.createElement("button");

open.type =
"button";

open.className =
"openButton";

open.textContent =
item.type === "audio"
? "▶ Listen"
: "📖 Open";


open.onclick =
function(){

if(
item.type === "audio"
){

openAudio(item);

}else if(
item.type === "pdf"
){

openPDF(item);

}else{

openBook(item);

}

};


buttons.appendChild(
open
);


card.appendChild(
cover
);

card.appendChild(
del
);

card.appendChild(
buttons
);


return card;

}


/* ==========================================
   SEARCH
========================================== */

search.oninput =
function(){

render();

};


/* ==========================================
   OPEN TEXT BOOK
========================================== */

var reader =
document.getElementById("reader");

var readerTitle =
document.getElementById("readerTitle");

var readerContent =
document.getElementById("readerContent");

var backButton =
document.getElementById("backButton");


function openBook(book){

readerTitle.textContent =
book.title;

readerContent.innerHTML = "";


var heading =
document.createElement("h2");

heading.textContent =
book.title;


var text =
document.createElement("div");

text.textContent =
book.content;


readerContent.appendChild(
heading
);

readerContent.appendChild(
text
);


reader.style.display =
"block";

}


/* ==========================================
   AUDIO
========================================== */

var currentAudio = null;

var currentURL = null;


function openAudio(book){

closeAudio();


readerTitle.textContent =
book.title;

readerContent.innerHTML = "";


var screen =
document.createElement("div");

screen.className =
"audioScreen";


var album =
document.createElement("div");

album.className =
"album";

album.textContent =
"🎧";


var title =
document.createElement("h2");

title.textContent =
book.title;


var fileName =
document.createElement("p");

fileName.textContent =
book.filename;


var audio =
document.createElement("audio");

audio.controls = true;

audio.preload =
"metadata";


currentURL =
URL.createObjectURL(
book.file
);

audio.src =
currentURL;

currentAudio =
audio;


/* SKIP BUTTONS */

var controls =
document.createElement("div");

controls.className =
"controls";


var back =
document.createElement("button");

back.type =
"button";

back.textContent =
"↶ 15 sec";


var forward =
document.createElement("button");

forward.type =
"button";

forward.textContent =
"30 sec ↷";


back.onclick =
function(){

audio.currentTime =
Math.max(
0,
audio.currentTime - 15
);

};


forward.onclick =
function(){

audio.currentTime =
Math.min(
audio.duration || 0,
audio.currentTime + 30
);

};


controls.appendChild(
back
);

controls.appendChild(
forward
);


/* SPEED */

var speed =
document.createElement("div");

speed.className =
"speed";


[
0.75,
1,
1.25,
1.5,
2
]
.forEach(
function(rate){

var button =
document.createElement("button");

button.type =
"button";

button.textContent =
rate + "×";


button.onclick =
function(){

audio.playbackRate =
rate;

};


speed.appendChild(
button
);

});


screen.appendChild(
album
);

screen.appendChild(
title
);

screen.appendChild(
fileName
);

screen.appendChild(
audio
);

screen.appendChild(
controls
);

screen.appendChild(
speed
);


readerContent.appendChild(
screen
);


reader.style.display =
"block";


audio.onended =
function(){

book.position = 0;

};


audio.ontimeupdate =
function(){

book.position =
audio.currentTime;

};


if(
book.position
){

audio.onloadedmetadata =
function(){

audio.currentTime =
Math.min(
book.position,
audio.duration || 0
);

};

}

}


/* ==========================================
   PDF
========================================== */

function openPDF(book){

readerTitle.textContent =
book.title;

readerContent.innerHTML = "";


var blob =
new Blob(
[
book.data
],
{
type:"application/pdf"
}
);


var url =
URL.createObjectURL(
blob
);


var frame =
document.createElement("iframe");

frame.style.width =
"100%";

frame.style.height =
"80vh";

frame.style.border =
"0";

frame.src =
url;


readerContent.appendChild(
frame
);


reader.style.display =
"block";

}


/* ==========================================
   CLOSE
========================================== */

backButton.onclick =
function(){

closeAudio();

reader.style.display =
"none";

};


function closeAudio(){

if(currentAudio){

try{
currentAudio.pause();
}catch(e){}

}

currentAudio = null;


if(currentURL){

try{
URL.revokeObjectURL(
currentURL
);
}catch(e){}

}

currentURL = null;

}


/* ==========================================
   SAVE TEXT/PDF LIBRARY
========================================== */

function saveTextBooks(){

try{

var saved =
books
.filter(
function(item){

return item.type !== "audio";

})
.map(
function(item){

return {

id:item.id,

title:item.title,

filename:item.filename,

type:item.type,

content:item.content || null,

data:item.data || null

};

});


localStorage.setItem(
"chickenSoupBooks",
JSON.stringify(
saved
)
);

}catch(e){

console.log(
"Storage unavailable"
);

}

}


/* ==========================================
   LOAD SAVED BOOKS
========================================== */

function loadBooks(){

try{

var saved =
localStorage.getItem(
"chickenSoupBooks"
);


if(saved){

books =
JSON.parse(
saved
);

}

}catch(e){

books = [];

}

render();

}


loadBooks();

</script>

</body>
</html>
