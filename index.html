<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#75472f">

<title>Chicken Soup Library</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
background:#f6efe6;
color:#35271f;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
background:linear-gradient(145deg,#9b6543,#75472f);
color:white;
padding:35px 20px 25px;
padding-top:calc(35px + env(safe-area-inset-top));
border-radius:0 0 28px 28px;
}

h1{
margin:0;
font-family:Georgia,serif;
font-size:28px;
}

main{
max-width:700px;
margin:auto;
padding:20px;
}

.add{
display:block;
width:100%;
padding:17px;
border:0;
border-radius:16px;
background:#75472f;
color:white;
font-size:18px;
font-weight:bold;
margin-bottom:20px;
}

#fileInput{
display:none;
}

.status{
background:#fffaf4;
border:1px solid #e5d8ca;
border-radius:16px;
padding:18px;
margin-bottom:20px;
line-height:1.5;
}

.book{
display:none;
background:#fffaf4;
border:1px solid #e5d8ca;
border-radius:18px;
padding:20px;
}

.book h2{
font-family:Georgia,serif;
}

.reader{
margin-top:20px;
font-family:Georgia,serif;
font-size:19px;
line-height:1.7;
white-space:pre-wrap;
}

audio{
width:100%;
margin-top:20px;
}
</style>
</head>

<body>

<header>
<h1>🍲 Chicken Soup Library</h1>
<div>Stories that feed the soul</div>
</header>

<main>

<button
type="button"
class="add"
id="addBook">
＋ Add Book or Audiobook
</button>

<input
type="file"
id="fileInput"
accept=".txt,.html,.htm,.pdf,.mp3,.m4a,.m4b,.wav">

<div
class="status"
id="status">
📚 Your library is empty.<br><br>
Tap <b>＋ Add Book or Audiobook</b>
to choose something from Files.
</div>

<div
class="book"
id="book">

<h2 id="title"></h2>

<div id="info"></div>

<div id="player"></div>

<div
class="reader"
id="reader">
</div>

</div>

</main>

<script>

var addBook =
document.getElementById("addBook");

var fileInput =
document.getElementById("fileInput");

var statusBox =
document.getElementById("status");

var bookBox =
document.getElementById("book");

var titleBox =
document.getElementById("title");

var infoBox =
document.getElementById("info");

var playerBox =
document.getElementById("player");

var readerBox =
document.getElementById("reader");


/* OPEN IPHONE FILES */

addBook.onclick = function(){

fileInput.click();

};


/* FILE SELECTED */

fileInput.onchange = function(){

if(!fileInput.files.length){
return;
}

var file =
fileInput.files[0];

showFile(file);

};


/* SHOW FILE */

function showFile(file){

var name =
file.name;

var lower =
name.toLowerCase();

var title =
name.replace(
/\.[^/.]+$/,
""
);

statusBox.style.display =
"none";

bookBox.style.display =
"block";

titleBox.textContent =
title;

infoBox.textContent =
"File: " + name;

playerBox.innerHTML =
"";

readerBox.innerHTML =
"";


/* AUDIO */

if(
lower.endsWith(".mp3") ||
lower.endsWith(".m4a") ||
lower.endsWith(".m4b") ||
lower.endsWith(".wav")
){

var audio =
document.createElement("audio");

audio.controls = true;

audio.preload = "metadata";

audio.src =
URL.createObjectURL(file);

playerBox.appendChild(audio);

infoBox.textContent =
"🎧 Audiobook • " + name;

return;

}


/* TEXT BOOK */

if(
lower.endsWith(".txt") ||
lower.endsWith(".html") ||
lower.endsWith(".htm")
){

var reader =
new FileReader();

reader.onload =
function(){

readerBox.textContent =
reader.result;

infoBox.textContent =
"📖 Book • " + name;

};

reader.readAsText(file);

return;

}


/* PDF */

if(lower.endsWith(".pdf")){

var url =
URL.createObjectURL(file);

var link =
document.createElement("a");

link.href = url;

link.target = "_blank";

link.textContent =
"📕 Open PDF";

link.style.display =
"block";

link.style.marginTop =
"20px";

link.style.padding =
"15px";

link.style.textAlign =
"center";

link.style.background =
"#eadaca";

link.style.borderRadius =
"12px";

link.style.textDecoration =
"none";

link.style.color =
"#67422e";

playerBox.appendChild(link);

return;

}


/* UNKNOWN FILE */

infoBox.textContent =
"File selected: " + name;

}

</script>

</body>
</html>
